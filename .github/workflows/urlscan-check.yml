name: Personal urlscan · Scan an owned page
on:
  workflow_dispatch:
    inputs:
      target:
        description: Public owner-authorized page (the scan is public at urlscan.io)
        type: choice
        options:
          - https://coolcode.ca/
          - https://jsdyer.github.io/
          - https://liminalhacker.com/
          - https://slashaccess.com/
          - https://jsdtechnologies.ca/
          - https://jsd.technology/
          - https://jeffreydyer.ca/
          - https://nethush.com/
          - https://interweb.international/
          - https://funapps.ca/
          - https://hackme.ca/
          - https://superapp.ca/
          - https://coolcode.ca/rackexpiry/
          - https://coolcode.ca/radarscope/
          - https://coolcode.ca/hotspotledger/
        default: https://coolcode.ca/
      custom_url:
        description: Optional HTTPS page on an owned configured site; overrides the selection
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: owner-urlscan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Submit one public scan and return provider links
        env:
          URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
          TARGET: ${{ inputs.custom_url || inputs.target || 'https://coolcode.ca/' }}
        run: python3 scripts/urlscan_check.py --target "$TARGET"
