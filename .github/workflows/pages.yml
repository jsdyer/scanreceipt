name: Receipts · Capture and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      capture_url:
        description: Optional owned HTTPS page to save publicly; blank captures the daily set
        type: string
        default: ''
  schedule:
    - cron: '47 14 * * *'
permissions:
  contents: read
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install source parsers
        run: python3 -m pip install -r requirements.txt
      - name: Install browser test dependencies
        run: |
          python3 -m pip install -r tests/browser-requirements.txt
          python3 -m playwright install --with-deps chromium
      - name: Select collection mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
        run: |
          collect=false
          if [ "$EVENT" != pull_request ] && { [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ] || [ ! -f data/current.json ] || python3 -c 'import json,sys; sys.exit(0 if json.load(open("data/current.json")).get("collector")!="owned-chromium-v1" else 1)'; }; then collect=true; fi
          echo "collect=$collect" >> "$GITHUB_OUTPUT"

      - name: Monitor collection start
        if: steps.mode.outputs.collect == 'true'
        env:
          HC: ${{ secrets.HEALTHCHECKS_PING_URL }}
        run: if [ -n "$HC" ]; then curl -fsS --retry 2 --max-time 15 "$HC/start" >/dev/null || true; fi
      - name: Capture our public pages directly
        if: steps.mode.outputs.collect == 'true'
        env:
          CAPTURE_URL: ${{ inputs.capture_url }}
        run: python3 scripts/collect.py --target "$CAPTURE_URL"
      - name: Test analytical models and source parsers
        run: |
          node --test tests/*.test.mjs
          python3 -m unittest discover -s tests -v
      - name: Build saved data offline
        run: python3 scripts/build.py
      - name: Check desktop, mobile, filters, source details and CSV
        run: python3 tests/browser_smoke.py
      - name: Save full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-checks
          path: browser-checks/
          retention-days: 7
      - name: Commit validated source history
        if: steps.mode.outputs.collect == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data archive evidence
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: preserve validated public-source capture'
            gh auth setup-git
            git push origin HEAD:main
          fi
      - name: Monitor collection result
        if: always() && steps.mode.outputs.collect == 'true'
        env:
          HC: ${{ secrets.HEALTHCHECKS_PING_URL }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ -n "$HC" ]; then
            suffix=''
            if [ "$JOB_STATUS" != success ]; then suffix='/fail'; fi
            curl -fsS --retry 2 --max-time 15 "$HC$suffix" >/dev/null || true
          fi
      - name: Package Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: publish
